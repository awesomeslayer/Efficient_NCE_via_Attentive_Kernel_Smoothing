  qformer: false
  conv: false
  odernn: true           # Включено
  grud: true             # Включено
  log_ncde: false        # Выключил для экономии времени

log_ncde_params:
  step_sizes: [10]
  depths: [1]

# --- НАСТРОЙКИ ПРОПУСКОВ ---
test_drop_rates: false
drop_rates: [0.0]        # 0.0 означает, что пропусков (NaN) не будет вообще

